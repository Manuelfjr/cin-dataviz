<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>JavaScript module example</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Menu Superior -->
    <script src="menu.js"></script>
    <script type="module" src="main.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        /* Estilo para a seção de explicação */
        .explication {
            font-family: 'Roboto', sans-serif;
            color: #333;
            background-color: #f9f9f9;
            padding: 20px;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            line-height: 1.6;
        }

        /* Estilo para o título */
        .explication h2 {
            font-size: 1.8em;
            color: #2c3e50;
            text-align: left;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        /* Estilo para os parágrafos */
        .explication p {
            font-size: 1em;
            text-align: left;
            margin-bottom: 15px;
        }

        /* Estilo para as palavras destacadas */
        .explication strong {
            color: #3498db;
            font-weight: bold;
        }

        /* Ajuste para o container */
        .explication p:last-child {
            margin-bottom: 0;
        }
    </style>
    <div class="explication">
        <h2>Disciplina 1170 - Visualização de Dados</h2>
        <p>
            Ana Carla de Carvalho Correia (20241031602)<br>
            Manuel Ferreira Junior (20241032637)<br>
            Thifany Ketuli Silva de Souza (20241032628)

        </p>

    </div>

</html>
